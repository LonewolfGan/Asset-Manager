    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EverydayTools Hub — Free Online Tools" />

    <!-- Canonical & Hreflang (fallback — SSR pages override these) -->
    <link rel="canonical" href="https://everydaytools.qzz.io" />
    <link rel="alternate" hreflang="en" href="https://everydaytools.qzz.io/en" />
    <link rel="alternate" hreflang="fr" href="https://everydaytools.qzz.io/fr" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Plausible Analytics — privacy-first, no cookies, no consent required -->
    <script defer data-domain="everydaytools.qzz.io" src="https://plausible.io/js/plausible.js"></script>

    <!-- Critical CSS: page structure + colors before Vite bundle loads -->
    <style>html,body{margin:0;padding:0;background:#F7F7F5;color:#111111;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}[data-theme="dark"]{background:#08090a;color:#f4f4f5}#root{display:flex;flex-direction:column;min-height:100vh}</style>
    <!-- Theme: apply before first paint to prevent flash -->
    <script>
      (function(){try{var t=localStorage.getItem('et:theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
